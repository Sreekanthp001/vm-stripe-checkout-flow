<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Venturemond | Secure Payment Gateway</title>
    <meta name="description" content="Secure payments powered by Venturemond" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/global.css" />
    <script src="https://js.stripe.com/v3/"></script>
    <script src="./script.js" defer></script>
  </head>

  <body>
    <div class="sr-root">
      <div class="sr-main">
        <header class="sr-header" style="text-align:center; padding: 20px;">
           <h1 style="color: #635bff; font-weight: 800;">VENTUREMOND</h1>
        </header>
        <h2 style="text-align:center;">Choose a collaboration plan</h2>

        <div class="price-table-container">
          <section>
              <img src="img/starter.png" width="120" height="120" />
              <div class="name">Starter Plan</div>
              <div class="price">$12</div>
              <div class="duration">per month</div>
              <button id="basic-plan-btn" class="pay-btn">Get Started</button>
          </section>
          <section>
              <img src="img/professional.png" width="120" height="120" />
              <div class="name">Agency Pro</div>
              <div class="price">$18</div>
              <div class="duration">per month</div>
              <button id="pro-plan-btn" class="pay-btn">Select Pro</button>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
