<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Payment Successful | Venturemond</title>
    <link rel="stylesheet" href="css/global.css" />
  </head>
  <body>
    <div class="sr-root">
      <div class="sr-main" style="text-align: center; padding-top: 50px;">
        <div class="sr-payment-summary completed-view">
            <h1 style="color: #24b47e;">✔ Payment Succeeded</h1>
            <h2 id="plan-name">Thank you for choosing Venturemond</h2>
            <p>Your subscription is now active. We've sent a receipt to your email.</p>
          </div>
          <div class="completed-view-section">
            <button onclick="window.location.href = '/';" style="padding: 10px 20px; background: #635bff; color: white; border: none; border-radius: 5px; cursor: pointer;">
                Return to Dashboard
            </button>
          </div>
      </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan');
        if(plan) {
            document.getElementById('plan-name').innerText = "Venturemond " + plan + " Activated!";
        }
    </script>
  </body>
</html>
